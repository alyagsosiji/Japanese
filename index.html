<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天の川 · 은하수 일본어 단어장 — 히라가나·가타가나 &amp; JLPT N5–N1 7,809단어</title>
  <meta
    name="description"
    content="은하수 밤하늘 아래에서 배우는 일본어 단어장. 히라가나·가타가나·탁음·반탁음·요음·촉음·장음 기본 발음부터 JMdict 검증 JLPT N5–N1 7,809개 단어, 예문 후리가나, 플래시카드, 퀴즈까지 한곳에서 학습하세요."
  />
  <meta name="theme-color" content="#071022" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071124'/%3E%3Cpath d='M32 10 L35.8 28.2 L54 32 L35.8 35.8 L32 54 L28.2 35.8 L10 32 L28.2 28.2 Z' fill='%23e8cfa0'/%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    html, body, *, *::before, *::after {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
      -webkit-tap-highlight-color: transparent !important;
    }
  </style>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <!-- Fullscreen Astronomical Milky Way Canvas -->
  <canvas id="milkyway-canvas" aria-hidden="true"></canvas>

  <div class="app-shell">
    <!-- Top Celestial Navigation -->
    <header class="site-header">
      <div class="header-inner">
        <a href="#top" class="brand" id="brand-home" aria-label="天の川 은하수 일본어 단어장 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"
                fill="#e8cfa0"
              />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-jp">天の川</span>
            <span class="brand-kr">은하수 일본어 단어장</span>
          </span>
        </a>

        <nav class="main-nav" role="tablist" aria-label="주요 학습 메뉴">
          <button type="button" class="nav-tab is-active" id="nav-kana" data-view="kana" role="tab" aria-selected="true">
            기본 발음
          </button>
          <button type="button" class="nav-tab" id="nav-vocab" data-view="vocab" role="tab" aria-selected="false">
            JLPT 단어장
          </button>
          <button type="button" class="nav-tab" id="nav-flashcards" data-view="flashcards" role="tab" aria-selected="false">
            플래시카드
          </button>
          <button type="button" class="nav-tab" id="nav-quiz" data-view="quiz" role="tab" aria-selected="false">
            단어 퀴즈
          </button>
        </nav>

        <div class="header-actions">
          <button type="button" class="btn-ghost-sm" id="btn-speed-toggle" title="일본어 음성 재생 속도 전환">
            음성 1.0x
          </button>
          <button type="button" class="btn-ghost-sm" id="btn-open-progress" aria-label="내 별자리 학습 현황 열기">
            <span>내 별자리</span>
            <span class="progress-pill-count" id="header-progress-count">0 / 7,809</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content" id="top">
      <!-- Serene Milky Way Opening -->
      <section class="hero" aria-label="서비스 소개">
        <div class="hero-kicker">天の川 · AMANOGAWA LEXICON</div>
        <h1 class="hero-title">은하수 아래, 빈틈없는 일본어 단어장</h1>
        <p class="hero-desc">
          히라가나·가타가나·탁음·반탁음·요음 기초 발음부터 JMdict 대조 검증된
          JLPT N5–N1 7,809개 단어와 후리가나 예문까지 한곳에서 차분히 익혀 보세요.
        </p>

        <div class="constellation-strip" aria-label="빠른 이동">
          <button type="button" class="star-jump" id="jump-kana" data-jump="kana">
            <span class="star-dot" style="background: var(--gold);"></span>
            <span>기본 발음</span>
            <span class="star-jump-count">104자</span>
          </button>
          <button type="button" class="star-jump" id="jump-n5" data-jump="N5">
            <span class="star-dot" style="background: var(--lvl-n5);"></span>
            <span>JLPT N5</span>
            <span class="star-jump-count">674</span>
          </button>
          <button type="button" class="star-jump" id="jump-n4" data-jump="N4">
            <span class="star-dot" style="background: var(--lvl-n4);"></span>
            <span>JLPT N4</span>
            <span class="star-jump-count">630</span>
          </button>
          <button type="button" class="star-jump" id="jump-n3" data-jump="N3">
            <span class="star-dot" style="background: var(--lvl-n3);"></span>
            <span>JLPT N3</span>
            <span class="star-jump-count">1,659</span>
          </button>
          <button type="button" class="star-jump" id="jump-n2" data-jump="N2">
            <span class="star-dot" style="background: var(--lvl-n2);"></span>
            <span>JLPT N2</span>
            <span class="star-jump-count">1,778</span>
          </button>
          <button type="button" class="star-jump" id="jump-n1" data-jump="N1">
            <span class="star-dot" style="background: var(--lvl-n1);"></span>
            <span>JLPT N1</span>
            <span class="star-jump-count">3,068</span>
          </button>
        </div>
      </section>

      <div id="workspace-anchor"></div>

      <!-- ================================================================
           VIEW 1: 기본 발음 (히라가나 · 가타가나 · 탁음 · 반탁음 · 요음 · 특수음)
           ================================================================ -->
      <section class="view-section is-active" id="view-kana" aria-label="일본어 기본 발음">
        <div class="section-bar">
          <div class="segmented" id="kana-subtabs" role="tablist" aria-label="발음 분류">
            <button type="button" class="seg-btn is-active" id="kana-tab-seion" data-kana-tab="seion">
              청음 50음도<span class="sub-cnt">46</span>
            </button>
            <button type="button" class="seg-btn" id="kana-tab-dakuon" data-kana-tab="dakuon">
              탁음 · 반탁음<span class="sub-cnt">25</span>
            </button>
            <button type="button" class="seg-btn" id="kana-tab-yoon" data-kana-tab="yoon">
              요음<span class="sub-cnt">33</span>
            </button>
            <button type="button" class="seg-btn" id="kana-tab-rules" data-kana-tab="rules">
              촉음 · 장음 · 특수음
            </button>
            <button type="button" class="seg-btn" id="kana-tab-quiz" data-kana-tab="quiz">
              발음 퀴즈
            </button>
          </div>

          <div class="segmented" id="kana-script-switch" aria-label="문자 표시 방식">
            <button type="button" class="seg-btn" id="script-hira" data-script="hiragana">히라가나</button>
            <button type="button" class="seg-btn" id="script-kata" data-script="katakana">가타가나</button>
            <button type="button" class="seg-btn is-active" id="script-both" data-script="both">함께 보기</button>
          </div>
        </div>

        <div id="kana-stage"></div>
      </section>

      <!-- ================================================================
           VIEW 2: JLPT 단어장 (N5 ~ N1 총 7,809단어)
           ================================================================ -->
      <section class="view-section" id="view-vocab" aria-label="JLPT 단어장">
        <div class="glass-panel vocab-toolbar">
          <div class="level-tabs" id="vocab-level-tabs" role="tablist" aria-label="JLPT 급수 선택">
            <button type="button" class="level-tab" id="lvl-tab-all" data-level="ALL">
              <span>전체</span><span class="level-tab-cnt">7,809</span>
            </button>
            <button type="button" class="level-tab is-active" id="lvl-tab-n5" data-level="N5">
              <span class="star-dot" style="background:var(--lvl-n5);"></span>
              <span>N5</span><span class="level-tab-cnt">674</span>
            </button>
            <button type="button" class="level-tab" id="lvl-tab-n4" data-level="N4">
              <span class="star-dot" style="background:var(--lvl-n4);"></span>
              <span>N4</span><span class="level-tab-cnt">630</span>
            </button>
            <button type="button" class="level-tab" id="lvl-tab-n3" data-level="N3">
              <span class="star-dot" style="background:var(--lvl-n3);"></span>
              <span>N3</span><span class="level-tab-cnt">1,659</span>
            </button>
            <button type="button" class="level-tab" id="lvl-tab-n2" data-level="N2">
              <span class="star-dot" style="background:var(--lvl-n2);"></span>
              <span>N2</span><span class="level-tab-cnt">1,778</span>
            </button>
            <button type="button" class="level-tab" id="lvl-tab-n1" data-level="N1">
              <span class="star-dot" style="background:var(--lvl-n1);"></span>
              <span>N1</span><span class="level-tab-cnt">3,068</span>
            </button>
          </div>

          <div class="search-filter-row">
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="search"
                id="vocab-search"
                class="search-input"
                placeholder="한자, 히라가나, 로마자, 한국어 뜻으로 검색 (예: 勉強, べんきょう, 공부)..."
                autocomplete="off"
                aria-label="단어 검색"
              />
              <button type="button" class="search-clear" id="vocab-search-clear" aria-label="검색어 지우기">×</button>
            </div>

            <div class="filter-controls">
              <select id="vocab-pos-filter" class="select-pill" aria-label="품사 필터">
                <option value="ALL">전체 품사</option>
                <option value="n">명사 · 대명사</option>
                <option value="v">동사</option>
                <option value="adj">형용사 · 연체사</option>
                <option value="adv">부사</option>
                <option value="other">표현 · 접속사 · 기타</option>
              </select>

              <select id="vocab-status-filter" class="select-pill" aria-label="학습 상태 필터">
                <option value="ALL">전체 상태</option>
                <option value="UNMASTERED">미암기 단어</option>
                <option value="MASTERED">암기 완료</option>
                <option value="BOOKMARKS">별표 단어 ★</option>
              </select>

              <select id="vocab-sort" class="select-pill" aria-label="정렬 기준">
                <option value="default">기본순</option>
                <option value="kana">오십음순</option>
                <option value="random">랜덤 셔플</option>
              </select>

              <button type="button" class="btn-ghost-sm is-active" id="btn-toggle-furigana">후리가나</button>
              <button type="button" class="btn-ghost-sm" id="btn-toggle-blur">뜻 가리기</button>
            </div>
          </div>
        </div>

        <div class="results-meta" id="vocab-results-meta"></div>
        <div class="vocab-grid" id="vocab-grid"></div>
        <nav class="pagination" id="vocab-pagination" aria-label="단어 목록 페이지 이동"></nav>
      </section>

      <!-- ================================================================
           VIEW 3: 플래시카드 (별자리 암기)
           ================================================================ -->
      <section class="view-section" id="view-flashcards" aria-label="플래시카드 학습">
        <div class="glass-panel study-controls">
          <div class="study-control-group">
            <select id="fc-scope" class="select-pill" aria-label="플래시카드 급수 선택">
              <option value="N5">JLPT N5 (674)</option>
              <option value="N4">JLPT N4 (630)</option>
              <option value="N3">JLPT N3 (1,659)</option>
              <option value="N2">JLPT N2 (1,778)</option>
              <option value="N1">JLPT N1 (3,068)</option>
              <option value="ALL">전 급수 종합 (7,809)</option>
              <option value="BOOKMARKS">별표 단어 ★</option>
              <option value="UNMASTERED">미암기 단어</option>
            </select>

            <select id="fc-count" class="select-pill" aria-label="카드 수 선택">
              <option value="20">20장</option>
              <option value="50">50장</option>
              <option value="100">100장</option>
              <option value="0">전체</option>
            </select>

            <select id="fc-dir" class="select-pill" aria-label="출제 방향 선택">
              <option value="ja_ko">일본어 → 한국어</option>
              <option value="ko_ja">한국어 → 일본어</option>
            </select>
          </div>

          <div class="study-control-group">
            <button type="button" class="btn-ghost-sm is-active" id="fc-auto-speak">자동 발음</button>
            <button type="button" class="btn-secondary" id="fc-shuffle-btn">새로 섞기</button>
          </div>
        </div>

        <div class="flashcard-stage" id="flashcard-stage"></div>
      </section>

      <!-- ================================================================
           VIEW 4: 단어 퀴즈 (성운 테스트)
           ================================================================ -->
      <section class="view-section" id="view-quiz" aria-label="JLPT 단어 퀴즈">
        <div id="quiz-stage"></div>
      </section>
    </main>

          (CC BY-SA 4.0)
        </div>
      </div>

  </div>

  <!-- Word Detail Modal -->
  <div class="modal-backdrop" id="word-modal" role="dialog" aria-modal="true" aria-label="단어 상세 정보">
    <div class="modal-dialog" id="word-modal-body"></div>
  </div>

  <!-- Progress Observatory Modal -->
  <div class="modal-backdrop" id="progress-modal" role="dialog" aria-modal="true" aria-label="내 별자리 학습 현황">
    <div class="modal-dialog" id="progress-modal-body"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Scripts (N5 preloaded for instant initial response; N4-N1 lazy-loaded automatically) -->
  <script src="data/kana.js?v=4"></script>
  <script src="data/vocab-n5.js"></script>
  <script src="js/starfield.js?v=4" defer></script>
  <script src="js/app.js?v=4" defer></script>
